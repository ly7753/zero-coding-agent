[package]
name = "zero-coding-agent"
version = "0.2.2"
edition = "2021"

[dependencies]
tokio = { version = "1.38", features = ["full", "signal", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-webpki-roots"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-util = "0.3"
dotenvy = "0.15"
chrono = "0.4"
regex = "1.10"
base64 = "0.22"
bytes = "1.6"
rustyline = "14.0"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }

# 纯 Rust 文档解析引擎
calamine = "0.26"
docx-rs = "0.4"
pdf-extract = "0.7"
pathdiff = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
