name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 (纯静态 MUSL)
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            bin_name: zero-coding-agent
            use_cross: true

          # Linux ARM64 (纯静态 MUSL)
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            bin_name: zero-coding-agent
            use_cross: true

          # macOS ARM64
          - os: macos-14
            target: aarch64-apple-darwin
            bin_name: zero-coding-agent
            use_cross: false

          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: zero-coding-agent.exe
            use_cross: false

          # Windows ARM64
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            bin_name: zero-coding-agent.exe
            use_cross: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # 快速安装 cross（避免每次跑 CI 从源码编译）
      - name: Install Cross
        if: matrix.use_cross
        uses: taiki-e/install-action@cross

      - name: Build Release Binary
        shell: bash
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      # ─── Unix 打包：收集二进制 + 辅助文件 ───
      - name: Package Archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ARCHIVE_NAME="zero-coding-agent-${{ matrix.target }}.tar.gz"
          STAGING="dist"
          mkdir -p "${STAGING}"

          # 1. 放入二进制
          cp "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "${STAGING}/"

          # 2. 放入辅助文件（容错复制：存在就打包，没有也不报错）
          cp -f README* LICENSE* LICENCE* "${STAGING}/" 2>/dev/null || true
          # 如果有示例配置文件，取消下面注释：
          # cp -f config.example.* "${STAGING}/" 2>/dev/null || true

          # 3. 压缩暂存区的所有内容
          tar -czf "${ARCHIVE_NAME}" -C "${STAGING}" .
          echo "ASSET_PATH=${ARCHIVE_NAME}" >> $GITHUB_ENV

      # ─── Windows 打包：收集二进制 + 辅助文件 ───
      - name: Package Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ArchiveName = "zero-coding-agent-${{ matrix.target }}.zip"
          $Staging = "dist"
          New-Item -ItemType Directory -Force -Path $Staging

          # 1. 放入二进制
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" -Destination $Staging

          # 2. 放入辅助文件（容错复制）
          Get-Item -Path "README*", "LICENSE*", "LICENCE*" -ErrorAction SilentlyContinue | Copy-Item -Destination $Staging
          # 如果有示例配置：
          # Get-Item -Path "config.example.*" -ErrorAction SilentlyContinue | Copy-Item -Destination $Staging

          # 3. 压缩为 zip
          Compress-Archive -Path "$Staging/*" -DestinationPath $ArchiveName
          echo "ASSET_PATH=$ArchiveName" >> $env:GITHUB_ENV

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: ${{ env.ASSET_PATH }}

  publish:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: binary-*
          merge-multiple: true

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Latest Release' }}
          make_latest: true
          prerelease: false
          files: release-assets/*
