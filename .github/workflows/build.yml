name: Release

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64 glibc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu

          # Linux x86_64 musl 纯静态
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl

          # Linux aarch64 glibc
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu

          # Linux aarch64 musl 纯静态
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl

          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc

          # macOS Apple Silicon
          - os: macos-latest
            target: aarch64-apple-darwin

          # macOS Intel
          - os: macos-13
            target: x86_64-apple-darwin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install musl-tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package archive
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cd target/${{ matrix.target }}/release
            7z a ../../../dist/zero-coding-agent-${{ matrix.target }}.zip zero-coding-agent.exe
          else
            tar -czvf dist/zero-coding-agent-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release zero-coding-agent
          fi

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          prerelease: false
          files: dist/*
